<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nilai PTS GANJIL</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            display: flex;
            height: 100vh;
            background: #f5f5f5;
            overflow: hidden;
        }

        /* ===== SIDEBAR ===== */
        #sidebar {
            width: 320px;
            background: #fff;
            border-right: 1px solid #e0e0e0;
            display: flex;
            flex-direction: column;
        }
        #sidebar-header {
            padding: 18px 20px;
            background: linear-gradient(135deg, #4285f4, #357ae8);
            color: white;
        }
        #sidebar-header h1 { font-size: 16px; }
        #sidebar-header p { font-size: 12px; opacity: 0.9; margin-top: 3px; }

        .form-section { padding: 16px 20px; border-bottom: 1px solid #eee; }
        .form-section label {
            display: block;
            font-size: 12px;
            font-weight: 600;
            color: #666;
            margin-bottom: 6px;
            text-transform: uppercase;
            letter-spacing: 0.3px;
        }
        .form-section select {
            width: 100%;
            padding: 10px 12px;
            font-size: 14px;
            border: 1px solid #ddd;
            border-radius: 8px;
            outline: none;
            background: white;
            cursor: pointer;
        }
        .form-section select:focus { border-color: #4285f4; }

        #file-list {
            flex: 1;
            overflow-y: auto;
            padding: 8px;
        }
        .file-item {
            padding: 12px;
            margin-bottom: 4px;
            border-radius: 8px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 10px;
            transition: background 0.2s;
            font-size: 14px;
        }
        .file-item:hover { background: #f0f7ff; }
        .file-item.active { background: #4285f4; color: white; }
        .file-icon { font-size: 18px; }
        .file-name { flex: 1; word-break: break-word; }

        .empty-msg, .loading-msg {
            padding: 30px 20px;
            text-align: center;
            color: #888;
            font-size: 13px;
            line-height: 1.6;
        }
        .spinner {
            display: inline-block;
            width: 24px;
            height: 24px;
            border: 3px solid #f3f3f3;
            border-top: 3px solid #4285f4;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 10px;
        }
        @keyframes spin { 100% { transform: rotate(360deg); } }

        /* ===== MAIN VIEWER ===== */
        #main { flex: 1; display: flex; flex-direction: column; }
        #viewer-header {
            padding: 14px 20px;
            background: #fff;
            border-bottom: 1px solid #e0e0e0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        #current-file { font-size: 14px; font-weight: 500; color: #333; }
        #open-new {
            font-size: 13px;
            color: #4285f4;
            text-decoration: none;
            padding: 6px 12px;
            border-radius: 6px;
            border: 1px solid #4285f4;
            display: none;
        }
        #open-new:hover { background: #f0f7ff; }
        #viewer { flex: 1; border: none; background: #e8eaed; }

        /* ===== MOBILE ===== */
        #menu-toggle {
            display: none;
            position: fixed;
            top: 10px;
            left: 10px;
            z-index: 1000;
            background: #4285f4;
            color: white;
            border: none;
            padding: 10px 14px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 18px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.2);
        }
        @media (max-width: 768px) {
            #sidebar {
                position: fixed;
                top: 0;
                left: 0;
                height: 100vh;
                z-index: 999;
                transform: translateX(-100%);
                transition: transform 0.3s;
                box-shadow: 2px 0 10px rgba(0,0,0,0.1);
            }
            #sidebar.show { transform: translateX(0); }
            #menu-toggle { display: block; }
            #viewer-header { padding-left: 60px; }
        }
    </style>
</head>
<body>

<button id="menu-toggle" onclick="document.getElementById('sidebar').classList.toggle('show')">☰</button>

<aside id="sidebar">
    <div id="sidebar-header">
        <h1>📚 Nilai PTS GANJIL</h1>
        <p id="total-info">Pilih mapel & kelas</p>
    </div>

    <div class="form-section">
        <label>📚 Mata Pelajaran</label>
        <select id="mapel" onchange="onChange()">
            <option value="">-- Pilih Mapel --</option>
        </select>
    </div>

    <div class="form-section">
        <label>🎓 Kelas</label>
        <select id="kelas" onchange="onChange()">
            <option value="">-- Pilih Kelas --</option>
        </select>
    </div>

    <div id="file-list">
        <div class="empty-msg">👆 Pilih mata pelajaran & kelas dulu</div>
    </div>
</aside>

<main id="main">
    <div id="viewer-header">
        <span id="current-file">Pilih file untuk melihat</span>
        <a id="open-new" href="#" target="_blank">↗ Buka di tab baru</a>
    </div>
    <iframe id="viewer" src=""></iframe>
</main>

<script>
/* ============================================================
   ⚠️⚠️⚠️  GANTI BARIS DI BAWAH INI  ⚠️⚠️⚠️
   Tempel URL Web App Anda (yang berakhiran /exec)
   ============================================================ */
const API_URL = 'https://script.google.com/macros/s/AKfycbyunqShIeqjQubM5cqg3pQ2l00ihQa7vw8HSnd7eujssGv4PbwX360rrAXr8S-KYFrX/exec';
/* ============================================================ */


// ===== INIT: Load daftar mapel & kelas =====
async function init() {
    try {
        const res = await fetch(API_URL + '?action=mapel');
        const data = await res.json();

        if (data.success) {
            const mapelSelect = document.getElementById('mapel');
            mapelSelect.innerHTML = '<option value="">-- Pilih Mapel --</option>' +
                data.mapel.map(m => `<option value="${m}">${m}</option>`).join('');

            const kelasSelect = document.getElementById('kelas');
            kelasSelect.innerHTML = '<option value="">-- Pilih Kelas --</option>' +
                data.kelas.map(k => `<option value="${k}">Kelas ${k}</option>`).join('');
        } else {
            document.getElementById('file-list').innerHTML = 
                '<div class="empty-msg" style="color:#ea4335;">❌ Server error: ' + (data.message || '-') + '</div>';
        }
    } catch (err) {
        document.getElementById('file-list').innerHTML = 
            '<div class="empty-msg" style="color:#ea4335;">❌ Gagal koneksi ke server<br><small>' + err.message + '</small><br><br>Cek:<br>1. URL API_URL sudah benar?<br>2. Deployment sudah "Anyone"?<br>3. Koneksi internet OK?</div>';
    }
}

// ===== SAAT MAPEL/KELAS DIPILIH =====
function onChange() {
    const mapel = document.getElementById('mapel').value;
    const kelas = document.getElementById('kelas').value;
    const list = document.getElementById('file-list');
    const total = document.getElementById('total-info');

    if (!mapel || !kelas) {
        list.innerHTML = '<div class="empty-msg">👆 Pilih mata pelajaran & kelas dulu</div>';
        total.textContent = 'Pilih mapel & kelas';
        return;
    }

    total.textContent = mapel + ' — Kelas ' + kelas;
    list.innerHTML = '<div class="loading-msg"><div class="spinner"></div><p>Memuat...</p></div>';

    loadFiles(mapel, kelas);
}

async function loadFiles(mapel, kelas) {
    try {
        const url = API_URL + '?action=list_by&mapel=' + encodeURIComponent(mapel) + '&kelas=' + encodeURIComponent(kelas);
        const res = await fetch(url);
        const data = await res.json();

        const list = document.getElementById('file-list');

        if (data.success && data.files && data.files.length > 0) {
            list.innerHTML = data.files.map(f => `
                <div class="file-item" onclick="openPDF('${f.id}', '${f.name.replace(/'/g, "\\'")}', this)">
                    <span class="file-icon">📄</span>
                    <span class="file-name">${f.name}</span>
                </div>
            `).join('');
        } else if (data.success) {
            list.innerHTML = '<div class="empty-msg">📭 Belum ada file untuk<br><strong>' + mapel + ' — Kelas ' + kelas + '</strong></div>';
        } else {
            list.innerHTML = '<div class="empty-msg" style="color:#ea4335;">❌ ' + (data.message || 'Error') + '</div>';
        }
    } catch (err) {
        document.getElementById('file-list').innerHTML = 
            '<div class="empty-msg" style="color:#ea4335;">❌ Error: ' + err.message + '</div>';
    }
}

function openPDF(id, nama, el) {
    document.getElementById('viewer').src = 'https://drive.google.com/file/d/' + id + '/preview';
    const openNew = document.getElementById('open-new');
    openNew.href = 'https://drive.google.com/file/d/' + id + '/view';
    openNew.style.display = 'inline-block';
    document.getElementById('current-file').textContent = '📄 ' + nama;

    document.querySelectorAll('.file-item').forEach(e => e.classList.remove('active'));
    el.classList.add('active');

    if (window.innerWidth <= 768) {
        document.getElementById('sidebar').classList.remove('show');
    }
}

// Jalankan saat halaman dimuat
init();
</script>
</body>
</html>
